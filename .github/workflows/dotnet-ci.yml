name: .NET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore services/Luvora.sln

      - name: Build
        run: dotnet build services/Luvora.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test services/Luvora.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
