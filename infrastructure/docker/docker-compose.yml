        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConfigurationDatabase: Host=postgres;Port=5432;Database=configuration_db;Username=luvora;Password=eshanfis511
