      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__NotificationDatabase: Host=postgres;Port=5432;Database=notification_db;Username=luvora;Password=eshanfis511
      Jwt__Key: ${JWT_KEY:-LDk9ZUiN2ygsLxRB2a7YgUlKHCAGp0Tbk0ltBDWtOpQ=}
      Jwt__Issuer: Luvora.AuthService
      Jwt__Audience: Luvora.Client
      Services__OrderService: http://order-service:8080/

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: luvora
      RabbitMq__Password: luvora

