# ================================================================
# Volumes
# ================================================================

volumes:

  postgres_data:
    name: luvora-postgres-data

  rabbitmq_data:
    name: luvora-rabbitmq-data

  product_images:
    name: luvora-product-images


# ================================================================
# Network
# ================================================================

networks:

  luvora-network:
    driver: bridge
