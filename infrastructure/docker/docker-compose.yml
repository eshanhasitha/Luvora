        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DeliveryDatabase: Host=postgres;Port=5432;Database=delivery_db;Username=luvora;Password=eshanfis511
      Jwt__Key: ${JWT_KEY:-LDk9ZUiN2ygsLxRB2a7YgUlKHCAGp0Tbk0ltBDWtOpQ=}
      Jwt__Issuer: Luvora.AuthService
      Jwt__Audience: Luvora.Client

    networks:
      - luvora-network


  # ============================================================
  # Notification Service
  # ============================================================

  notification-service:
    build:
      context: ../../services
      dockerfile: NotificationService/Dockerfile

    container_name: luvora-notification

    depends_on:
      postgres:
        condition: service_healthy
