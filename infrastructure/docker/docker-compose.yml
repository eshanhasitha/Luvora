services:

  postgres:
    image: postgres:17
    container_name: luvora-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: luvora
      POSTGRES_PASSWORD: eshanfis511
      POSTGRES_DB: mainluvora
    ports:
      - "5432:5432"

    volumes:
      - luvora_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luvora -d mainluvora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  luvora_postgres_data: