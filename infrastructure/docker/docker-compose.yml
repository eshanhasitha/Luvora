      context: ../../services
      dockerfile: AuditService/Dockerfile
    container_name: luvora-audit
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuditDatabase: Host=postgres;Port=5432;Database=audit_db;Username=luvora;Password=eshanfis511
      Audit__IngestKey: ${AUDIT_INGEST_KEY:-dev-audit-ingest-key-change-in-production}
      ServiceUrls__Auth: http://auth-service:8080/
      ServiceUrls__Product: http://product-service:8080/
      ServiceUrls__Inventory: http://inventory-service:8080/
      ServiceUrls__Order: http://order-service:8080/
      ServiceUrls__Payment: http://payment-service:8080/
      ServiceUrls__Delivery: http://delivery-service:8080/
      ServiceUrls__Promotion: http://promotion-service:8080/
      ServiceUrls__Support: http://support-service:8080/
      ServiceUrls__Reporting: http://reporting-service:8080/
      ServiceUrls__Configuration: http://configuration-service:8080/
      ServiceUrls__Audit: http://audit-service:8080/
      ServiceUrls__Notification: http://notification-service:8080/
      ServiceUrls__Review: http://review-service:8080/
    networks:
      - luvora-network


  # ============================================================
  # API Gateway - YARP
  # ============================================================

  api-gateway:
    build:
      context: ../../services
      dockerfile: ApiGateWay/Dockerfile

    image: luvora-api-gateway:1.0
    container_name: luvora-api-gateway

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      Jwt__Key: ${JWT_KEY:-LDk9ZUiN2ygsLxRB2a7YgUlKHCAGp0Tbk0ltBDWtOpQ=}
      Jwt__Issuer: Luvora.AuthService
      Jwt__Audience: Luvora.Client
      Audit__BaseUrl: http://audit-service:8080/
      Audit__IngestKey: ${AUDIT_INGEST_KEY:-dev-audit-ingest-key-change-in-production}

    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      delivery-service:
        condition: service_started
      notification-service:
        condition: service_started
      review-service:
        condition: service_started
      promotion-service:
        condition: service_started
      support-service:
        condition: service_started
      reporting-service:
        condition: service_started
      configuration-service:
        condition: service_started
      audit-service:
        condition: service_started

    ports:
      - "5000:8080"

    networks:
      - luvora-network


  # ============================================================
  # Laravel Frontend
  # ============================================================

  frontend:
    build:
      context: ../../../Luvora-Frontend/frontend/frontend
      dockerfile: Dockerfile

    container_name: luvora-frontend

    depends_on:
      - api-gateway

    ports:
      - "8000:80"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      # Keep your existing APP_KEY here locally.
      APP_KEY: base64:cEoJEAhp/uoXOQ+/IlZh7yUp5dbwYKutKm8M3PhINzs=

      # IMPORTANT:
      # Laravel container -> Docker network -> YARP
      LUVORA_API_URL: http://api-gateway:8080

    networks:
      - luvora-network
   
