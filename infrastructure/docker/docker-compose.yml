services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:17
    container_name: luvora-postgres

    environment:
      POSTGRES_USER: luvora
      POSTGRES_PASSWORD: eshanfis511
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luvora -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - luvora-network

  database-bootstrap:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      PGPASSWORD: eshanfis511
      PGUSER: luvora
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      for database in promotion_db support_db reporting_db configuration_db audit_db; do
        psql -h postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$database'" | grep -q 1 || createdb -h postgres "$$database";
      done
    networks:
      - luvora-network


  # ============================================================
  # RabbitMQ
  # ============================================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: luvora-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: luvora
      RABBITMQ_DEFAULT_PASS: luvora

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - luvora-network


  # ============================================================
  # Auth Service
  # ============================================================

  auth-service:
    build:
      context: ../../services
      dockerfile: AuthService/Dockerfile

    container_name: luvora-auth

    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDatabase: Host=postgres;Port=5432;Database=auth_db;Username=luvora;Password=eshanfis511
      Jwt__Key: ${JWT_KEY:-LDk9ZUiN2ygsLxRB2a7YgUlKHCAGp0Tbk0ltBDWtOpQ=}
      Jwt__Issuer: Luvora.AuthService
      Jwt__Audience: Luvora.Client
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}

    networks:
      - luvora-network


  # ============================================================
  # Product Service
  # ============================================================

  product-service:
    build:
      context: ../../services
      dockerfile: ProductService/Dockerfile

    container_name: luvora-product

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProductDatabase: Host=postgres;Port=5432;Database=product_db;Username=luvora;Password=eshanfis511
      Jwt__Key: ${JWT_KEY:-LDk9ZUiN2ygsLxRB2a7YgUlKHCAGp0Tbk0ltBDWtOpQ=}
      Jwt__Issuer: Luvora.AuthService
      Jwt__Audience: Luvora.Client
      ImageStorage__Path: /app/storage/products
      Services__InventoryService: http://inventory-service:8080/

    volumes:
      - product_images:/app/storage/products

    networks:
      - luvora-network


  # ============================================================
  # Inventory Service
  # ============================================================

  inventory-service:
    build:
      context: ../../services
      dockerfile: InventoryService/Dockerfile

    container_name: luvora-inventory

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__InventoryDatabase: Host=postgres;Port=5432;Database=inventory_db;Username=luvora;Password=eshanfis511
      Jwt__Key: ${JWT_KEY:-LDk9ZUiN2ygsLxRB2a7YgUlKHCAGp0Tbk0ltBDWtOpQ=}
      Jwt__Issuer: Luvora.AuthService
      Jwt__Audience: Luvora.Client

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: luvora
      RabbitMq__Password: luvora

    networks:
      - luvora-network


  # ============================================================
  # Cart Service
  # ============================================================

  cart-service:
