apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: luvora
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: luvora-auth-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"

            - name: ConnectionStrings__AuthDatabase
              valueFrom:
                secretKeyRef:
                  name: luvora-db-secret
                  key: ConnectionStrings__AuthDatabase

            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: luvora-app-secret
                  key: JWT_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: luvora

spec:
  selector:
    app: auth-service

  ports:
    - port: 8080
      targetPort: 8080


