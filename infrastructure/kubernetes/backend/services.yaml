apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: luvora
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: luvora-auth-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"

            - name: ConnectionStrings__AuthDatabase
              valueFrom:
                secretKeyRef:
                  name: luvora-db-secret
                  key: ConnectionStrings__AuthDatabase

            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: luvora-app-secret
                  key: JWT_KEY

            - name: Jwt__Issuer
              value: "Luvora.AuthService"
            - name: Jwt__Audience
              value: "Luvora.Client"

            - name: ImageStorage__Path
              value: "/app/storage/products"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: luvora

spec:
  selector:
    app: auth-service

  ports:
    - port: 8080
      targetPort: 8080


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: luvora

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: luvora-product-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"

            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: luvora-app-secret
                  key: JWT_KEY

            - name: Jwt__Issuer
              value: "Luvora.AuthService"

            - name: Jwt__Audience
              value: "Luvora.Client"

            - name: ConnectionStrings__ProductDatabase
              valueFrom:
                secretKeyRef:
                  name: luvora-db-secret
                  key: ConnectionStrings__ProductDatabase

            - name: Services__InventoryService
              value: "http://inventory-service:8080/"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: product-images
              mountPath: /app/storage/products

      volumes:
        - name: product-images
          persistentVolumeClaim:
            claimName: product-images-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: luvora

spec:
  selector:
    app: product-service

  ports:
    - port: 8080
      targetPort: 8080

