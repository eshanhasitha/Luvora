apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: luvora

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: luvora-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          env:
            - name: APP_ENV
              value: "production"

            - name: APP_DEBUG
              value: "false"

            - name: LUVORA_API_URL
              value: "http://api-gateway:8080"

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: APP_KEY
                  
            - name: SESSION_DRIVER
              value: "cookie"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"