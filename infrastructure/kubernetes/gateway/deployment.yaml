apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: luvora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: luvora-api-gateway:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: luvora-app-secret
                  key: JWT_KEY
            - name: Jwt__Issuer
              value: "Luvora.AuthService"
            - name: Jwt__Audience
              value: "Luvora.Client"
            - name: Audit__BaseUrl
              value: "http://audit-service:8080/"
            - name: Audit__IngestKey
              valueFrom:
                secretKeyRef:
                  name: luvora-app-secret
                  key: AUDIT_INGEST_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
