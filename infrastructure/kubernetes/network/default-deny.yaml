apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: luvora

spec:
  # Keep ingress open within the cluster for now; service-specific policies below
  # restrict access to Postgres, RabbitMQ, and the API backend.
  podSelector:
    matchLabels:
      network-policy-default-deny: "enabled"

  policyTypes:
    - Ingress
